name: Add classical garment options

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/add-classical-garments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch chinese classical garments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('chinese-classical.html')
          text = path.read_text(encoding='utf-8')

          old_cards = '''      <label class="card selected"><input type="radio" name="garment" value="hanClassical" checked><div class="name">漢風古雅</div><div class="desc">交領右衽、層疊衣襟、寬袖、樸雅莊重</div></label>
      <label class="card"><input type="radio" name="garment" value="hanModern"><div class="name">漢風新式改良</div><div class="desc">漢風交領邏輯與現代高訂收腰</div></label>
      <label class="card"><input type="radio" name="garment" value="tangClassical"><div class="name">盛唐華裳</div><div class="desc">高腰、大袖、金線、雍容華麗</div></label>
      <label class="card"><input type="radio" name="garment" value="tangModern"><div class="name">盛唐新式改良</div><div class="desc">唐風高腰輪廓與現代禮服剪裁</div></label>
      <label class="card"><input type="radio" name="garment" value="songClassical"><div class="name">宋韻清雅</div><div class="desc">褙子、窄袖、直線層次、淡雅留白</div></label>
      <label class="card"><input type="radio" name="garment" value="songModern"><div class="name">宋韻新式改良</div><div class="desc">宋韻極簡與現代精品比例</div></label>'''

          new_cards = '''      <label class="card selected"><input type="radio" name="garment" value="hanClassical" checked><div class="name">漢風古雅</div><div class="desc">交領右衽、層疊衣襟、寬袖、樸雅莊重</div></label>
      <label class="card"><input type="radio" name="garment" value="hanModern"><div class="name">漢風新式改良</div><div class="desc">漢風交領邏輯與現代高訂收腰</div></label>
      <label class="card"><input type="radio" name="garment" value="hanStraightRobe"><div class="name">漢風直身長袍</div><div class="desc">直身長線、交領前襟、修長端正</div></label>
      <label class="card"><input type="radio" name="garment" value="hanWrapSkirt"><div class="name">漢風繞襟長裙</div><div class="desc">繞襟包覆、自然腰線、長裙垂墜</div></label>
      <label class="card"><input type="radio" name="garment" value="tangClassical"><div class="name">盛唐華裳</div><div class="desc">高腰、大袖、金線、雍容華麗</div></label>
      <label class="card"><input type="radio" name="garment" value="tangModern"><div class="name">盛唐新式改良</div><div class="desc">唐風高腰輪廓與現代禮服剪裁</div></label>
      <label class="card"><input type="radio" name="garment" value="tangChestHighSkirt"><div class="name">盛唐齊胸長裙</div><div class="desc">齊胸高腰、短上衣比例、飽滿長裙</div></label>
      <label class="card"><input type="radio" name="garment" value="tangLapelRobe"><div class="name">盛唐翻領長袍</div><div class="desc">翻領前襟、束腰長袍、俐落修長</div></label>
      <label class="card"><input type="radio" name="garment" value="songClassical"><div class="name">宋韻清雅</div><div class="desc">褙子、窄袖、直線層次、淡雅留白</div></label>
      <label class="card"><input type="radio" name="garment" value="songModern"><div class="name">宋韻新式改良</div><div class="desc">宋韻極簡與現代精品比例</div></label>
      <label class="card"><input type="radio" name="garment" value="songOpenFrontRobe"><div class="name">宋韻對襟長衫</div><div class="desc">對襟直線、修長外衫、清雅克制</div></label>
      <label class="card"><input type="radio" name="garment" value="songShortTopSkirt"><div class="name">宋韻短衫長裙</div><div class="desc">短衫長裙、自然腰線、簡潔日常感</div></label>'''

          old_data = '''const garmentData = {
  hanClassical: 'Han-inspired cross-collar layered robes, right-over-left closure, wide flowing sleeves, restrained silk textures, dignified classical proportions, subtle woven details',
  hanModern: 'Han-inspired cross-collar construction, modern layered wrap tailoring, refined fitted waist, wide flowing sleeves, premium silk textiles, contemporary Chinese couture styling',
  tangClassical: 'Tang-inspired high-waisted robe ensemble, wide elegant sleeves, rich layered silk textures, ornate gold embroidery, graceful flowing silhouette, majestic courtly elegance',
  tangModern: 'Tang-inspired high-waisted silhouette, modern formal gown construction, sculpted couture bodice, flowing wide sleeves, luxurious silk and gold embroidery, high-fashion Chinese editorial styling',
  songClassical: 'Song-inspired layered garments, refined beizi-style silhouette, clean restrained lines, delicate silk and linen fabrics, soft understated palette, scholarly Chinese elegance',
  songModern: 'Song-inspired minimalist silhouette, modern beizi-inspired tailoring, clean contemporary proportions, delicate silk and linen textiles, restrained luxury styling, minimal Chinese couture aesthetic'
};'''

          new_data = '''const garmentData = {
  hanClassical: 'Han-inspired cross-collar layered robes, right-over-left closure, wide flowing sleeves, restrained silk textures, dignified classical proportions, subtle woven details',
  hanModern: 'Han-inspired cross-collar construction, modern layered wrap tailoring, refined fitted waist, wide flowing sleeves, premium silk textiles, contemporary Chinese couture styling',
  hanStraightRobe: 'Han-inspired straight full-length robe, clean elongated silhouette, structured cross-collar front, restrained waist definition, long continuous garment lines, dignified classical proportions',
  hanWrapSkirt: 'Han-inspired wrapped-front upper garment with a full-length skirt, extended overlapping front panels, graceful wraparound construction, defined natural waist, flowing lower silhouette, refined classical balance',
  tangClassical: 'Tang-inspired high-waisted robe ensemble, wide elegant sleeves, rich layered silk textures, ornate gold embroidery, graceful flowing silhouette, majestic courtly elegance',
  tangModern: 'Tang-inspired high-waisted silhouette, modern formal gown construction, sculpted couture bodice, flowing wide sleeves, luxurious silk and gold embroidery, high-fashion Chinese editorial styling',
  tangChestHighSkirt: 'Tang-inspired chest-high long skirt ensemble, very high raised waistline, short upper garment proportions, full floor-length skirt volume, rounded graceful silhouette, distinct Tang-period feminine proportions',
  tangLapelRobe: 'Tang-inspired lapel-collar full-length robe, open folded lapel construction, elongated straight silhouette, structured waist belt, clean robe lines, confident cosmopolitan Tang styling',
  songClassical: 'Song-inspired layered garments, refined beizi-style silhouette, clean restrained lines, delicate silk and linen fabrics, soft understated palette, scholarly Chinese elegance',
  songModern: 'Song-inspired minimalist silhouette, modern beizi-inspired tailoring, clean contemporary proportions, delicate silk and linen textiles, restrained luxury styling, minimal Chinese couture aesthetic',
  songOpenFrontRobe: 'Song-inspired open-front long outer garment, symmetrical parallel front panels, clean vertical silhouette, slender restrained proportions, long straight garment lines, quiet scholarly refinement',
  songShortTopSkirt: 'Song-inspired short upper garment and full-length skirt ensemble, compact upper proportions, natural waist placement, long restrained skirt silhouette, clean layered construction, simple elegant refinement'
};'''

          if old_cards not in text:
              raise SystemExit('服裝卡片原始區塊不符合預期，停止修改')
          if old_data not in text:
              raise SystemExit('garmentData 原始區塊不符合預期，停止修改')

          text = text.replace(old_cards, new_cards, 1)
          text = text.replace(old_data, new_data, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node scripts/check-static.mjs
          node scripts/validate-preset-refs.mjs
          node scripts/audit-100x.mjs

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/add-classical-garments.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chinese-classical.html .github/workflows/add-classical-garments.yml
          git commit -m "feat: expand Chinese classical garment themes"
          git push origin master
